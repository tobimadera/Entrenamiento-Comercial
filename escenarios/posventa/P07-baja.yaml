dueno:
  nombre:
    ar: Daniel Ferreyra
    br: Daniel Ferreira
  edad: 48
  genero: m
  perfil: >-
    Pragmático y de buen trato: si ve que algo le llena el taller sin complicarle la vida, lo
    hace. Va al grano y quiere saber quién hace qué.
concesionario: >-
  Concesionario mediano, al 96% de su objetivo de servicios. El taller tiene horas libres
  entre semana y hay unos 300 clientes con el service vencido hace más de 3 meses.
situacion: >-
  La reunión es sobre una campaña para recuperar a los clientes con mantenimiento vencido,
  aprovechando la cobertura Toyota 10 para quienes hacen los services en la red.
objecion_inicial: >-
  Me sirve llenar el taller, pero no tengo una persona dedicada a llamar clientes.
interes_oculto: >-
  Quiere aprovechar las horas libres del taller sin sumar costo fijo.
objeciones:
  - No tengo una persona dedicada a llamar clientes.
  - Muchos de esos clientes ya se fueron a un taller de barrio.
que_lo_mueve:
  - Que los recordatorios se puedan mandar por mensaje con un enlace para sacar turno, sin llamar uno por uno.
  - Que le recuerden que mantener los services en la red es lo que conserva la cobertura Toyota 10 del cliente.
  - Que le propongan medir el resultado al final del mes y ajustar.
limite: >-
  Máximo acuerdo: contactar a los 300 clientes y agendar 40 turnos en el mes, con un
  responsable de recepción. Acepta enseguida si el plan no le suma personal.
