<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrenador de Ventas</title>
<style>
  :root {
    --fondo: #f4f5f7; --panel: #ffffff; --texto: #1c2430; --suave: #5d6878; --borde: #d9dee6;
    --acento: #1f5fbf; --acento-texto: #ffffff; --yo: #dbe8fb; --otro: #eef0f3; --mal: #b3261e; --bien: #1b7a43;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12161c; --panel: #1b212a; --texto: #e7ebf1; --suave: #9aa5b5; --borde: #2f3845;
      --acento: #6aa3ff; --acento-texto: #0d1420; --yo: #24406b; --otro: #262e3a; --mal: #ff8a80; --bien: #6fd79a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  p.sub { color: var(--suave); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; }
  .opciones { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--borde); background: var(--panel); color: var(--texto); padding: 10px 16px; }
  button.activo, button.principal { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
  /* Banderas de país: la elegida se marca con un borde de color, sin pintar el fondo. */
  button.bandera { padding: 6px; line-height: 0; border-width: 2px; background: var(--panel); }
  button.bandera svg { width: 54px; height: 36px; border-radius: 4px; display: block; pointer-events: none;
                       box-shadow: 0 0 0 1px rgba(0, 0, 0, .12); }
  button.bandera.activo { background: var(--panel); border-color: var(--acento); box-shadow: 0 0 0 2px var(--acento); }
  button.bandera:not(.activo) svg { opacity: .55; }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { font: inherit; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--borde); background: var(--panel); color: var(--texto); }
  .escenario { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
  .escenario small { display: block; color: var(--suave); margin-top: 4px; }
  .escenario.activo small { color: inherit; opacity: .85; }
  .etiqueta { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; opacity: .8; }
  #chat .cabecera { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  #consigna { font-size: .9rem; color: var(--suave); margin-bottom: 12px; }
  #mensajes { display: flex; flex-direction: column; gap: 10px; min-height: 40vh; max-height: 58vh; overflow-y: auto; padding: 4px; }
  .burbuja { max-width: 82%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .burbuja.dueno { background: var(--otro); align-self: flex-start; }
  .burbuja.yo { background: var(--yo); align-self: flex-end; }
  .burbuja .quien { display: block; font-size: .75rem; color: var(--suave); margin-bottom: 2px; }
  #redactar { display: flex; gap: 8px; margin-top: 12px; align-items: flex-end; }
  #redactar textarea { resize: none; height: 72px; }
  .error { color: var(--mal); margin-top: 8px; }
  .nota { color: var(--suave); font-size: .85rem; margin: 8px 0 0; }
  /* Barra de complejidad: cuanto más a la derecha, más difícil el escenario. */
  .deslizador { max-width: 420px; }
  .deslizador input[type=range] { width: 100%; margin: 4px 0 0; accent-color: var(--acento); cursor: pointer;
    height: 8px; border-radius: 4px; appearance: none; -webkit-appearance: none;
    background: linear-gradient(to right, #1b7a43, #eda100, #b3261e); }
  .deslizador input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--panel); border: 3px solid var(--acento); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .deslizador input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%;
    background: var(--panel); border: 3px solid var(--acento); }
  .marcas { display: flex; justify-content: space-between; margin-top: 6px; color: var(--suave); font-size: .85rem; }
  .marcas span.activo { color: var(--texto); font-weight: 600; }
  .elegir { display: flex; gap: 8px; flex-wrap: wrap; }
  .elegir select { flex: 1 1 240px; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--borde);
                   background: var(--panel); color: var(--texto); }
  .objetivo { margin-top: 16px; padding: 12px 16px; border-left: 4px solid var(--acento); border-radius: 8px; background: var(--otro); }
  .objetivo p { margin: 4px 0 0; }
  #avatar { position: relative; margin: 0 auto 12px; width: 100%; max-width: 420px; aspect-ratio: 1 / 1;
            border-radius: 12px; overflow: hidden; background: var(--otro); }
  #avatar video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Mientras conecta, un velo tapa el video (el video sigue dibujándose: Simli lo necesita). */
  #estadoAvatar { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center;
                  padding: 12px; background: var(--otro); color: var(--suave); font-size: .9rem; text-align: center; }
  #avatar.conectado #estadoAvatar { display: none; }
  #avatar:not([hidden]) ~ #mensajes { min-height: 20vh; max-height: 30vh; }
  #referencias button small { display: block; color: var(--suave); font-size: .8rem; }
  #referencias button.activo small { color: inherit; opacity: .85; }
  .estado { color: var(--suave); margin-top: 8px; font-size: .9rem; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button.grabando { background: var(--mal); border-color: var(--mal); color: var(--panel); }
  .puntaje { font-size: 2.4rem; font-weight: 700; }
  .criterio { border-top: 1px solid var(--borde); padding: 10px 0; }
  .criterio b { display: flex; justify-content: space-between; gap: 12px; }
  .momento { border-left: 3px solid var(--acento); padding-left: 12px; margin: 12px 0; }
  .momento q { font-style: italic; }
  ul { margin: 4px 0; padding-left: 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- Pantalla 0: código de acceso (solo si el servidor lo exige) -->
  <section id="acceso" hidden>
    <h1>Entrenador de Ventas</h1>
    <p class="sub">Tu código de acceso personal · Seu código de acesso pessoal</p>
    <form class="panel" id="formAcceso">
      <input id="codigo" type="password" autocomplete="off">
      <p style="margin:16px 0 0"><button class="principal">Entrar</button></p>
      <div class="error" id="errorAcceso"></div>
    </form>
  </section>

  <!-- Pantalla 1: elegir práctica -->
  <section id="inicio">
    <h1 data-t="titulo"></h1>
    <p class="sub" data-t="subtitulo"></p>
    <div class="panel">
      <h2 style="margin-top:0" data-t="pais"></h2>
      <div class="opciones" id="paises">
        <button class="bandera" data-pais="ar" aria-label="Argentina" title="Argentina">
          <svg viewBox="0 0 60 40" aria-hidden="true">
            <rect width="60" height="40" fill="#74ACDF"/>
            <rect y="13.33" width="60" height="13.34" fill="#FFFFFF"/>
            <circle cx="30" cy="20" r="4.6" fill="#F6B40E" stroke="#85340A" stroke-width="0.6"/>
          </svg>
        </button>
        <button class="bandera" data-pais="br" aria-label="Brasil" title="Brasil">
          <svg viewBox="0 0 60 40" aria-hidden="true">
            <rect width="60" height="40" fill="#009C3B"/>
            <polygon points="30,4 56,20 30,36 4,20" fill="#FFDF00"/>
            <circle cx="30" cy="20" r="8.5" fill="#002776"/>
            <path d="M21.8 18.2 Q30 15.6 38.4 21.6" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
          </svg>
        </button>
      </div>
      <h2 data-t="foco"></h2>
      <div class="opciones" id="focos">
        <button data-foco="ventas" data-t="ventas"></button>
        <button data-foco="posventa" data-t="posventa"></button>
        <button data-foco="especiales" data-t="especiales"></button>
      </div>
      <h2><span data-t="complejidad"></span>: <span id="nivelActual"></span></h2>
      <div class="deslizador">
        <input type="range" id="nivel" min="0" max="2" step="1" value="1">
        <div class="marcas" id="marcasNivel"></div>
      </div>
      <h2 data-t="concesionario"></h2>
      <div class="elegir">
        <select id="concesionarios" aria-label="Concesionario"></select>
        <button id="confirmar" data-t="confirmar" disabled></button>
      </div>
      <p class="nota" data-t="notaReferencia"></p>
      <div class="objetivo" id="objetivo" hidden>
        <div class="etiqueta" data-t="tuObjetivo"></div>
        <p id="objetivoTexto"></p>
        <p class="nota" id="objetivoContexto"></p>
      </div>
      <div id="bloqueNombre">
        <h2 data-t="tuNombre"></h2>
        <input id="nombre" autocomplete="off">
      </div>
      <p class="sub" id="quienPractica" hidden style="margin:16px 0 0"></p>
      <p style="margin:16px 0 0"><button class="principal" id="empezar" data-t="empezar" disabled></button></p>
      <div class="error" id="errorInicio"></div>
    </div>
  </section>

  <!-- Pantalla 2: conversación -->
  <section id="chat" hidden>
    <div class="cabecera">
      <div><span class="etiqueta" data-t="reunionCon"></span><h1 id="dueno"></h1></div>
      <div class="acciones">
        <button id="vozActiva" hidden></button>
        <button id="terminar" data-t="terminar"></button>
      </div>
    </div>
    <div class="panel">
      <div id="consigna"></div>
      <div id="avatar" hidden>
        <video id="avatarVideo" autoplay playsinline muted></video>
        <audio id="avatarAudio" autoplay></audio>
        <div id="estadoAvatar"></div>
      </div>
      <div id="mensajes"></div>
      <div id="redactar">
        <textarea id="texto"></textarea>
        <button id="microfono" hidden></button>
        <button class="principal" id="enviar" data-t="enviar"></button>
      </div>
      <div class="estado" id="estadoVoz"></div>
      <div class="error" id="errorChat"></div>
    </div>
  </section>

  <!-- Pantalla 3: devolución -->
  <section id="devolucion" hidden>
    <h1 data-t="devolucion"></h1>
    <div class="panel" id="contenidoDevolucion"></div>
    <p><button class="principal" id="otra" data-t="otra"></button></p>
  </section>
</main>

<script>
const TEXTOS = {
  es: {
    titulo: "Entrenador de Ventas", subtitulo: "Practicá una reunión con el dueño de un concesionario y recibí una devolución.",
    pais: "País", foco: "Foco de entrenamiento", ventas: "Ventas", posventa: "Posventa",
    escenario: "Escenario", tuNombre: "Tu nombre (opcional)", empezar: "Empezar la reunión",
    reunionCon: "Reunión con", terminar: "Terminar y evaluar", enviar: "Enviar", vos: "Vos",
    objetivo: "Tu objetivo: ", escribi: "Escribí lo que le dirías…", evaluando: "Evaluando la conversación…",
    devolucion: "Devolución", otra: "Practicar otra vez", resultado: "Resultado", criterios: "Criterios",
    fortalezas: "Fortalezas", mejoras: "A mejorar", momentos: "Momentos clave", dijiste: "Dijiste",
    alternativa: "Alternativa", dificultad: "Dificultad", corta: "Conversá un poco más antes de pedir la evaluación.",
    especiales: "Ventas especiales", concesionario: "Concesionario", generico: "Concesionario genérico",
    elegiConcesionario: "Elegí un concesionario…", confirmar: "Confirmar", tuObjetivo: "Tu objetivo",
    complejidad: "Complejidad", baja: "Baja", media: "Media", alta: "Alta",
    genericoDetalle: "sin concesionario de referencia",
    notaReferencia: "Concesionarios reales de la red, tomados como referencia comercial. La personalidad, los números y los problemas del dueño son ficticios.",
    contexto: "Lo que sabés del dueño: ",
    conectando: "Conectando con", sinAvatar: "No se pudo mostrar la cara; el dueño sigue hablando solo con voz.",
    avatarOcupado: "Ahora no hay lugar para otra cara (se alcanzó el máximo de prácticas con avatar al mismo tiempo). El dueño sigue hablando solo con voz.",
    practicasComo: "Practicás como", hablar: "Hablar", enviarAudio: "Enviar audio", vozSi: "Voz: sí", vozNo: "Voz: no",
    grabando: "Grabando… tocá «Enviar audio» cuando termines.", transcribiendo: "Pasando tu audio a texto…",
    sinMic: "No se pudo usar el micrófono. Revisá el permiso del navegador.", nadaOido: "No se entendió el audio. Probá de nuevo.",
  },
  pt: {
    titulo: "Treinador de Vendas", subtitulo: "Pratique uma reunião com o dono de uma concessionária e receba um feedback.",
    pais: "País", foco: "Foco do treinamento", ventas: "Vendas", posventa: "Pós-venda",
    escenario: "Cenário", tuNombre: "Seu nome (opcional)", empezar: "Começar a reunião",
    reunionCon: "Reunião com", terminar: "Encerrar e avaliar", enviar: "Enviar", vos: "Você",
    objetivo: "Seu objetivo: ", escribi: "Escreva o que você diria…", evaluando: "Avaliando a conversa…",
    devolucion: "Feedback", otra: "Praticar de novo", resultado: "Resultado", criterios: "Critérios",
    fortalezas: "Pontos fortes", mejoras: "A melhorar", momentos: "Momentos-chave", dijiste: "Você disse",
    alternativa: "Alternativa", dificultad: "Dificuldade", corta: "Converse um pouco mais antes de pedir a avaliação.",
    especiales: "Vendas especiais", concesionario: "Concessionária", generico: "Concessionária genérica",
    elegiConcesionario: "Escolha uma concessionária…", confirmar: "Confirmar", tuObjetivo: "Seu objetivo",
    complejidad: "Complexidade", baja: "Baixa", media: "Média", alta: "Alta",
    genericoDetalle: "sem concessionária de referência",
    notaReferencia: "Concessionárias reais da rede, usadas como referência comercial. A personalidade, os números e os problemas do dono são fictícios.",
    contexto: "O que você sabe do dono: ",
    conectando: "Conectando com", sinAvatar: "Não foi possível mostrar o rosto; o dono continua falando só com voz.",
    avatarOcupado: "Agora não há vaga para outro rosto (chegou-se ao máximo de práticas com avatar ao mesmo tempo). O dono continua falando só com voz.",
    practicasComo: "Praticando como", hablar: "Falar", enviarAudio: "Enviar áudio", vozSi: "Voz: sim", vozNo: "Voz: não",
    grabando: "Gravando… toque em «Enviar áudio» quando terminar.", transcribiendo: "Transcrevendo seu áudio…",
    sinMic: "Não foi possível usar o microfone. Verifique a permissão do navegador.", nadaOido: "O áudio não foi entendido. Tente de novo.",
  },
};
const $ = (id) => document.getElementById(id);
const estado = { pais: "ar", foco: "ventas", dificultad: "media", escenario: null, escenarios: [], sesion: null, dueno: "", ocupado: false,
                 voz: false, vozActiva: true, turno: 0 };
let grabador = null, audioActual = null;
const idioma = () => (estado.pais === "br" ? "pt" : "es");
const t = (clave) => TEXTOS[idioma()][clave];

function crear(etiqueta, clase, texto) {
  const e = document.createElement(etiqueta);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function pintar() {
  document.documentElement.lang = idioma();
  document.querySelectorAll("[data-t]").forEach((e) => (e.textContent = t(e.dataset.t)));
  document.querySelectorAll("[data-pais]").forEach((b) => b.classList.toggle("activo", b.dataset.pais === estado.pais));
  document.querySelectorAll("[data-foco]").forEach((b) => b.classList.toggle("activo", b.dataset.foco === estado.foco));
  $("texto").placeholder = t("escribi");
  pintarConcesionarios();
  $("empezar").disabled = !estado.escenario;
  if (estado.consultor) $("quienPractica").textContent = `${t("practicasComo")} ${estado.consultor.nombre}`;
  pintarVoz();
}

// El consultor elige solo el concesionario. Al confirmar, el escenario sale al azar entre los
// casos de ese concesionario en el país y el foco elegidos, y recién ahí ve su objetivo.
// «Concesionario genérico» agrupa los escenarios que no tienen concesionario de referencia.
const GENERICO = "__generico";
const refsDe = (esc) => (esc.referencias && esc.referencias[estado.pais]) || [];
// Escenarios del foco y la complejidad elegidos: de ahí salen los concesionarios disponibles.
const delNivel = () => estado.escenarios.filter((e) => e.foco === estado.foco && e.dificultad === estado.dificultad);
function casosDe(valor) {
  return delNivel().filter((e) =>
    valor === GENERICO ? !refsDe(e).length : refsDe(e).some((r) => r.nombre === valor));
}

// La barra recorre solo los niveles que tienen escenarios en el foco elegido, de menor a mayor.
const NIVELES = ["baja", "media", "alta"];
const nivelesDisponibles = () =>
  NIVELES.filter((n) => estado.escenarios.some((e) => e.foco === estado.foco && e.dificultad === n));
function pintarDificultades() {
  const disponibles = nivelesDisponibles();
  if (!disponibles.includes(estado.dificultad)) estado.dificultad = disponibles[0] || "media";
  const barra = $("nivel"), posicion = disponibles.indexOf(estado.dificultad);
  barra.max = Math.max(disponibles.length - 1, 0);
  barra.value = Math.max(posicion, 0);
  barra.disabled = disponibles.length < 2;
  barra.setAttribute("aria-valuetext", t(estado.dificultad));
  $("nivelActual").textContent = t(estado.dificultad);
  $("marcasNivel").replaceChildren(...disponibles.map((n) => crear("span", n === estado.dificultad ? "activo" : "", t(n))));
}

function pintarConcesionarios() {
  pintarDificultades();
  const nombres = [...new Set(delNivel().flatMap((e) => refsDe(e).map((r) => r.nombre)))]
    .sort((a, b) => a.localeCompare(b));
  const opciones = [new Option(t("elegiConcesionario"), ""), ...nombres.map((n) => new Option(n, n))];
  if (casosDe(GENERICO).length) opciones.push(new Option(t("generico"), GENERICO));
  opciones[0].disabled = true;
  const sel = $("concesionarios");
  sel.replaceChildren(...opciones);
  const elegida = opciones.findIndex((o) => o.value && o.value === estado.concesionario);
  if (elegida < 0) estado.concesionario = "";
  sel.selectedIndex = Math.max(elegida, 0);
  // Una vez confirmado no se vuelve a sortear: para otro caso hay que cambiar el concesionario.
  $("confirmar").disabled = !estado.concesionario || !!estado.escenario;
  const esc = estado.escenarios.find((e) => e.id === estado.escenario);
  $("objetivo").hidden = !esc;
  if (esc) {
    $("objetivoTexto").textContent = `${esc.titulo[idioma()]}: ${esc.consigna[idioma()]}`;
    $("objetivoContexto").textContent = esc.contexto ? t("contexto") + esc.contexto[idioma()] : "";
  }
}

function confirmar() {
  const casos = casosDe(estado.concesionario);
  if (!casos.length) return;
  const esc = casos[Math.floor(Math.random() * casos.length)];
  const indice = refsDe(esc).findIndex((r) => r.nombre === estado.concesionario);
  estado.escenario = esc.id;
  estado.referencia = indice >= 0 ? indice : null;
  pintar();
}

function reiniciarEleccion() {
  estado.escenario = null;
  estado.referencia = null;
}

function pintarVoz() {
  $("vozActiva").hidden = $("microfono").hidden = !estado.voz;
  $("vozActiva").textContent = estado.vozActiva ? t("vozSi") : t("vozNo");
  $("vozActiva").classList.toggle("activo", estado.vozActiva);
  $("microfono").textContent = grabador ? t("enviarAudio") : t("hablar");
  $("microfono").classList.toggle("grabando", !!grabador);
}

function mostrar(pantalla) {
  for (const id of ["acceso", "inicio", "chat", "devolucion"]) $(id).hidden = id !== pantalla;
}

// Todas las llamadas al servidor llevan el código de acceso; si lo rechaza, se vuelve a pedir.
let codigo = "";
try { codigo = sessionStorage.getItem("codigo") || ""; } catch {}
async function api(ruta, opciones = {}) {
  opciones.headers = { ...(opciones.headers || {}), "X-Codigo": codigo };
  const r = await fetch(ruta, opciones);
  if (r.status === 401) { mostrar("acceso"); $("codigo").focus(); }
  return r;
}
async function cargarEscenarios() {
  const r = await api("/api/escenarios");
  if (!r.ok) return false;
  estado.escenarios = await r.json();
  try {
    const config = await (await api("/api/config")).json();
    estado.voz = config.voz === true;
    estado.avatar = config.avatar === true;
    estado.consultor = config.consultor;
  } catch { estado.voz = false; estado.consultor = null; }
  // Con código personal, la práctica queda a su nombre: no hace falta escribirlo.
  if (estado.consultor && !estado.paisElegido) estado.pais = estado.consultor.pais;
  $("bloqueNombre").hidden = !!estado.consultor;
  $("quienPractica").hidden = !estado.consultor;
  pintar();
  mostrar("inicio");
  return true;
}

function burbuja(clase, quien, texto) {
  const b = crear("div", "burbuja " + clase);
  const cuerpo = crear("span", "", texto);
  b.append(crear("span", "quien", quien), cuerpo);
  $("mensajes").append(b);
  $("mensajes").scrollTop = $("mensajes").scrollHeight;
  return cuerpo;
}

function ocupar(si) {
  estado.ocupado = si;
  $("enviar").disabled = $("terminar").disabled = $("microfono").disabled = si;
}

// ---------------------------------------------------------------- voz
// El dueño habla frase por frase mientras Claude escribe: cada frase completa se pide a
// ElevenLabs enseguida y se reproduce en orden, sin esperar la respuesta entera.
const cola = [];
let sonando = false;

function callar() {
  estado.turno++;  // lo que estaba en camino ya no se reproduce
  cola.splice(0).forEach(({ audio }) => audio.then((a) => {
    if (a.tipo === "mp3") URL.revokeObjectURL(a.dato); else a.dato.body?.cancel().catch(() => {});
  }, () => {}));
  if (audioActual) audioActual.pause();
  if (avatar.cliente) avatar.cliente.ClearBuffer();
}

// mp3: se reproduce en la página. pcm: va al avatar, que lo devuelve con la cara hablando.
function pedirAudio(frase, formato) {
  return api(`/api/sesiones/${estado.sesion}/voz`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto: frase, formato }),
  }).then(async (r) => {
    if (!r.ok) throw new Error(await textoDeError(r));
    // pcm: se entrega la respuesta sin leer, para pasarle el audio al avatar a medida que llega.
    return formato === "pcm"
      ? { tipo: "pcm", dato: r }
      : { tipo: "mp3", dato: URL.createObjectURL(await r.blob()) };
  });
}

// ---------------------------------------------------------------- avatar (Simli)
// El servidor da un permiso de sesión; la clave de Simli nunca llega a la página.
// Si el avatar no conecta o se corta, el dueño sigue hablando solo con voz.
const avatar = { cliente: null, listo: null, modulo: null };

function asegurarAvatar() {
  if (!estado.avatar || !estado.vozActiva || !estado.sesion) return Promise.resolve(false);
  if (!avatar.listo) avatar.listo = conectarAvatar(estado.sesion);
  return avatar.listo;
}

async function conectarAvatar(sesion) {
  $("avatar").hidden = false;
  $("avatar").classList.remove("conectado");
  $("estadoAvatar").textContent = `${t("conectando")} ${estado.dueno}…`;
  try {
    avatar.modulo ??= await import("https://esm.sh/simli-client@3.2.0");
    const r = await api(`/api/sesiones/${sesion}/avatar`, { method: "POST" });
    if (!r.ok) throw new Error(await textoDeError(r));
    const { session_token } = await r.json();
    const { SimliClient, LogLevel } = avatar.modulo;
    const c = new SimliClient(session_token, $("avatarVideo"), $("avatarAudio"), null, LogLevel.ERROR);
    c.on("stop", () => { if (avatar.cliente === c) { avatar.cliente = null; avatar.listo = null; $("avatar").classList.remove("conectado"); } });
    c.on("error", (detalle) => console.warn("Simli:", detalle));
    // Simli da por lista la cara cuando el navegador dibuja el primer cuadro. Si no aparece en
    // 20 s (por ejemplo, la pestaña quedó en segundo plano), se cierra para no gastar minutos.
    let espera;
    const limite = new Promise((_, rechazar) => { espera = setTimeout(() => rechazar(new Error("la cara tardó demasiado")), 20000); });
    try { await Promise.race([c.start(), limite]); }
    catch (e) { c.stop().catch(() => {}); throw e; }
    finally { clearTimeout(espera); }
    if (sesion !== estado.sesion) { c.stop().catch(() => {}); return false; }  // ya terminó esa práctica
    avatar.cliente = c;
    $("avatar").classList.add("conectado");
    $("estadoAvatar").textContent = "";
    return true;
  } catch (e) {
    console.warn("Avatar:", e);
    $("estadoAvatar").textContent = /RATE LIMIT/i.test(String(e)) ? t("avatarOcupado") : t("sinAvatar");
    return false;
  }
}

function cerrarAvatar() {
  const c = avatar.cliente;
  avatar.cliente = null;
  avatar.listo = null;
  if (c) c.stop().catch(() => {});
  $("avatar").classList.remove("conectado");
}

const TROZO = 6000;  // bytes de PCM por envío, como recomienda Simli (~190 ms de audio)
// Pasa el audio de una frase al avatar mientras ElevenLabs lo genera, sin esperar a que termine.
// Cada muestra son 2 bytes: un byte suelto al final de un pedazo espera al siguiente.
async function mandarAlAvatar(respuesta, turno) {
  const lector = respuesta.body.getReader();
  let pendiente = new Uint8Array(0);
  for (;;) {
    const { done, value } = await lector.read();
    if (turno !== estado.turno || !avatar.cliente) { lector.cancel().catch(() => {}); return; }
    if (value) {
      const junto = new Uint8Array(pendiente.length + value.length);
      junto.set(pendiente); junto.set(value, pendiente.length);
      const util = done ? junto.length : junto.length - (junto.length % TROZO);
      for (let i = 0; i < util; i += TROZO) avatar.cliente.sendAudioData(junto.subarray(i, Math.min(i + TROZO, util)));
      pendiente = junto.subarray(util);
    }
    if (done) {
      if (pendiente.length > 1) avatar.cliente.sendAudioData(pendiente.subarray(0, pendiente.length - (pendiente.length % 2)));
      return;
    }
  }
}

function sonar(url) {
  return new Promise((fin) => {
    const a = new Audio(url);
    audioActual = a;
    const listo = () => { if (audioActual === a) audioActual = null; URL.revokeObjectURL(url); fin(); };
    a.onended = a.onpause = a.onerror = listo;
    a.play().catch(listo);
  });
}

async function reproducirCola() {
  sonando = true;
  while (cola.length) {
    const { audio, turno } = cola.shift();
    let a;
    try { a = await audio; } catch (e) { $("errorChat").textContent = e.message; continue; }
    const vigente = turno === estado.turno && !grabador && estado.vozActiva;
    if (a.tipo === "pcm") {
      // El avatar encola y reproduce en orden; solo hay que mandarle las frases en orden.
      if (vigente && avatar.cliente) await mandarAlAvatar(a.dato, turno);
      else a.dato.body?.cancel().catch(() => {});
      continue;
    }
    if (!vigente) { URL.revokeObjectURL(a.dato); continue; }
    await sonar(a.dato);
  }
  sonando = false;
}

function decirFrase(frase, turno) {
  // Con avatar, la voz va en PCM a Simli; si el avatar no está (o falla al conectar), en mp3.
  // La frase no espera a la cara más de 5 s: si todavía no apareció, se dice solo con voz.
  const cara = Promise.race([asegurarAvatar(), new Promise((listo) => setTimeout(() => listo(false), 5000))]);
  const audio = cara.then((conAvatar) => pedirAudio(frase, conAvatar && avatar.cliente ? "pcm" : "mp3"));
  audio.catch(() => {});  // el error se muestra al llegar su turno en la cola
  cola.push({ audio, turno });
  if (!sonando) reproducirCola();
}

// Busca frases terminadas en el texto nuevo y las manda a decir. Junta las muy cortas con la
// siguiente para que la voz no suene entrecortada. Devuelve hasta dónde ya se mandó.
const FIN_DE_FRASE = /[.!?…]+["»”)]?\s+/g;
function decirFrasesNuevas(texto, desde, final, turno) {
  let resto = texto.slice(desde), m;
  FIN_DE_FRASE.lastIndex = 0;
  while ((m = FIN_DE_FRASE.exec(resto))) {
    const fin = m.index + m[0].length;
    if (resto.slice(0, fin).trim().length < 20) continue;
    decirFrase(resto.slice(0, fin).trim(), turno);
    desde += fin;
    resto = resto.slice(fin);
    FIN_DE_FRASE.lastIndex = 0;
  }
  if (final && resto.trim()) { decirFrase(resto.trim(), turno); desde = texto.length; }
  return desde;
}

const FORMATOS = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
async function microfono() {
  if (grabador) { grabador.stop(); return; }
  if (estado.ocupado) return;
  callar();
  $("errorChat").textContent = "";
  let flujo;
  try { flujo = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { $("errorChat").textContent = t("sinMic"); return; }
  const formato = FORMATOS.find((f) => window.MediaRecorder && MediaRecorder.isTypeSupported(f)) || "";
  const partes = [];
  const g = new MediaRecorder(flujo, formato ? { mimeType: formato } : undefined);
  g.ondataavailable = (e) => { if (e.data.size) partes.push(e.data); };
  g.onstop = () => {
    flujo.getTracks().forEach((pista) => pista.stop());
    grabador = null;
    pintarVoz();
    enviarAudio(new Blob(partes, { type: g.mimeType || formato || "audio/webm" }));
  };
  grabador = g;
  g.start();
  $("terminar").disabled = $("enviar").disabled = true;
  $("estadoVoz").textContent = t("grabando");
  pintarVoz();
}

async function enviarAudio(blob) {
  ocupar(true);
  $("estadoVoz").textContent = t("transcribiendo");
  const extension = blob.type.includes("mp4") ? "m4a" : blob.type.includes("ogg") ? "ogg" : "webm";
  const datos = new FormData();
  datos.append("audio", blob, "turno." + extension);
  let texto = "";
  try {
    const r = await api(`/api/sesiones/${estado.sesion}/transcripcion`, { method: "POST", body: datos });
    if (!r.ok) throw new Error(await textoDeError(r));
    texto = (await r.json()).texto;
    if (!texto) throw new Error(t("nadaOido"));
  } catch (e) {
    $("errorChat").textContent = e.message;
  }
  $("estadoVoz").textContent = "";
  ocupar(false);
  if (texto) hablar(texto, true);
}

async function textoDeError(r) {
  try { return (await r.json()).detail || r.statusText; } catch { return r.statusText; }
}

// Envía lo que dijo el representante (vacío = el dueño abre la reunión) y va mostrando la respuesta.
async function hablar(texto, porVoz = false) {
  $("errorChat").textContent = "";
  ocupar(true);
  callar();
  const turno = estado.turno, conVoz = estado.voz && estado.vozActiva;
  let dicho = 0;
  if (texto) burbuja("yo", t("vos"), texto);
  const cuerpo = burbuja("dueno", estado.dueno, "…");
  try {
    const r = await api(`/api/sesiones/${estado.sesion}/mensaje`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto, por_voz: porVoz, hablado: conVoz }),
    });
    if (!r.ok) throw new Error(await textoDeError(r));
    const lector = r.body.getReader(), deco = new TextDecoder();
    let todo = "";
    for (;;) {
      const { done, value } = await lector.read();
      if (done) break;
      todo += deco.decode(value, { stream: true });
      const corte = todo.indexOf("\n[[ERROR]] ");
      cuerpo.textContent = corte < 0 ? todo : todo.slice(0, corte);
      $("mensajes").scrollTop = $("mensajes").scrollHeight;
      if (corte >= 0) throw new Error(todo.slice(corte + 11));
      if (conVoz) dicho = decirFrasesNuevas(todo, dicho, false, turno);
    }
    if (conVoz) decirFrasesNuevas(todo, dicho, true, turno);
  } catch (e) {
    if (cuerpo.textContent === "…" || !cuerpo.textContent) cuerpo.parentElement.remove();
    $("errorChat").textContent = e.message;
  }
  ocupar(false);
  if (!porVoz) $("texto").focus();
}

async function empezar() {
  $("errorInicio").textContent = "";
  const r = await api("/api/sesiones", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ escenario_id: estado.escenario, pais: estado.pais, nombre: $("nombre").value,
                           referencia: estado.referencia }),
  });
  if (!r.ok) { $("errorInicio").textContent = await textoDeError(r); return; }
  const datos = await r.json();
  estado.sesion = datos.id; estado.dueno = datos.dueno;
  $("dueno").textContent = datos.concesionario ? `${datos.dueno} · ${datos.concesionario}` : datos.dueno;
  const esc = estado.escenarios.find((e) => e.id === estado.escenario);
  $("consigna").textContent = t("objetivo") + esc.consigna[idioma()]
    + (esc.contexto ? ` ${t("contexto")}${esc.contexto[idioma()]}` : "");
  $("mensajes").replaceChildren();
  cerrarAvatar();
  $("avatar").hidden = !(estado.avatar && estado.vozActiva);
  mostrar("chat");
  asegurarAvatar();  // conecta la cara mientras Claude prepara el saludo
  hablar("");
}

function enviar() {
  const texto = $("texto").value.trim();
  if (!texto || estado.ocupado) return;
  $("texto").value = "";
  hablar(texto);
}

async function terminar() {
  if (grabador) return;
  callar();
  cerrarAvatar();  // cada minuto de avatar conectado se cobra
  ocupar(true);
  $("errorChat").textContent = t("evaluando");
  const r = await api(`/api/sesiones/${estado.sesion}/evaluacion`, { method: "POST" });
  ocupar(false);
  if (!r.ok) { $("errorChat").textContent = r.status === 400 ? t("corta") : await textoDeError(r); return; }
  $("errorChat").textContent = "";
  pintarDevolucion(await r.json());
  mostrar("devolucion");
}

function pintarDevolucion(ev) {
  const c = $("contenidoDevolucion");
  c.replaceChildren();
  const lista = (titulo, items) => {
    const ul = crear("ul");
    items.forEach((i) => ul.append(crear("li", "", i)));
    c.append(crear("h2", "", titulo), ul);
  };
  c.append(crear("div", "puntaje", `${ev.puntaje_general} / 10`), crear("h2", "", t("resultado")), crear("p", "", ev.resultado));
  c.append(crear("h2", "", t("criterios")));
  for (const cr of ev.criterios) {
    const d = crear("div", "criterio"), b = crear("b");
    b.append(crear("span", "", cr.nombre), crear("span", "", `${cr.puntaje}/10`));
    d.append(b, crear("div", "", cr.comentario));
    c.append(d);
  }
  lista(t("fortalezas"), ev.fortalezas);
  lista(t("mejoras"), ev.mejoras);
  c.append(crear("h2", "", t("momentos")));
  for (const m of ev.momentos_clave) {
    const d = crear("div", "momento");
    const cita = crear("div"); cita.append(crear("b", "", t("dijiste") + ": "), crear("q", "", m.dijiste));
    const alt = crear("div"); alt.append(crear("b", "", t("alternativa") + ": "), crear("span", "", m.alternativa));
    d.append(cita, crear("div", "", m.efecto), alt);
    c.append(d);
  }
}

$("paises").onclick = (e) => { const b = e.target.closest("[data-pais]"); if (b) { estado.pais = b.dataset.pais; estado.paisElegido = true; estado.concesionario = ""; reiniciarEleccion(); pintar(); } };
$("focos").onclick = (e) => { if (e.target.dataset.foco) { estado.foco = e.target.dataset.foco; estado.concesionario = ""; reiniciarEleccion(); pintar(); } };
$("nivel").oninput = (e) => {
  const n = nivelesDisponibles()[Number(e.target.value)];
  if (n && n !== estado.dificultad) { estado.dificultad = n; estado.concesionario = ""; reiniciarEleccion(); pintar(); }
};
$("concesionarios").onchange = (e) => { estado.concesionario = e.target.value; reiniciarEleccion(); pintar(); };
$("confirmar").onclick = confirmar;
$("empezar").onclick = empezar;
$("enviar").onclick = enviar;
$("terminar").onclick = terminar;
$("microfono").onclick = microfono;
$("vozActiva").onclick = () => {
  estado.vozActiva = !estado.vozActiva;
  if (!estado.vozActiva) { callar(); cerrarAvatar(); }  // sin voz, la cara no tiene qué decir
  $("avatar").hidden = !(estado.avatar && estado.vozActiva);
  if (estado.vozActiva && estado.sesion && !$("chat").hidden) asegurarAvatar();
  pintarVoz();
};
$("otra").onclick = () => { callar(); cerrarAvatar(); estado.concesionario = ""; reiniciarEleccion(); pintar(); mostrar("inicio"); };
window.addEventListener("pagehide", cerrarAvatar);
$("texto").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); } });

$("formAcceso").onsubmit = async (e) => {
  e.preventDefault();
  codigo = $("codigo").value.trim();
  $("errorAcceso").textContent = "";
  if (await cargarEscenarios()) { try { sessionStorage.setItem("codigo", codigo); } catch {} }
  else $("errorAcceso").textContent = "Código incorrecto · Código incorreto";
};

pintar();
cargarEscenarios();
</script>
